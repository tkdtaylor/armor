<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, 'Cascadia Mono', 'Roboto Mono', monospace" font-size="13">
  <title>armor end-to-end demo: input injection block + canary exfiltration block</title>
  <desc>Static approximation of `make demo` running. See artifacts/recording.md for how to regenerate with asciinema.</desc>

  <!-- Terminal frame -->
  <rect x="0" y="0" width="820" height="540" rx="8" fill="#1e1e2e"/>
  <!-- Title bar -->
  <rect x="0" y="0" width="820" height="28" rx="8" fill="#181825"/>
  <rect x="0" y="20" width="820" height="8" fill="#181825"/>
  <circle cx="16" cy="14" r="6" fill="#f38ba8"/>
  <circle cx="34" cy="14" r="6" fill="#f9e2af"/>
  <circle cx="52" cy="14" r="6" fill="#a6e3a1"/>
  <text x="410" y="18" text-anchor="middle" fill="#cdd6f4" font-size="12">armor end-to-end demo &#8212; make demo</text>

  <!-- Output -->
  <g transform="translate(20, 56)">
    <text y="0" fill="#94e2d5">$ make demo</text>
    <text y="22" fill="#cdd6f4">Demo started. Using temp directory: /tmp/armor-demo-X9k2L7</text>
    <text y="44" fill="#cdd6f4">Generating canary values...</text>
    <text y="66" fill="#cdd6f4">Starting daemon...</text>
    <text y="88" fill="#cdd6f4">Socket ready.</text>
