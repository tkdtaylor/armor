    <text y="404" fill="#cdd6f4">Stderr: Blocked: exfiltration.canary_emitted</text>
    <text y="426" fill="#a6e3a1">&#10003; Verified: triggered_canary=aws-key-000 (not the value)</text>
    <text y="448" fill="#a6e3a1">&#10003; Scenario 2 complete!</text>

    <text y="480" fill="#a6e3a1" font-weight="bold">Demo PASSED</text>
