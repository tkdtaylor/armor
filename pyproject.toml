[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "armor-ai"
version = "0.11.0"
description = "A defense-in-depth security layer for LLM agents"
readme = {file = "README_PYPI.md", content-type = "text/markdown"}
requires-python = ">=3.12"
license = {text = "PolyForm Noncommercial License 1.0.0"}
authors = [{name = "Kevin Taylor", email = "tools@taylorguard.me"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

dependencies = [
    "cryptography>=48.0.0",
    "pyahocorasick>=2.3.1",
    "pyyaml>=6.0.3",
    "llama-cpp-python>=0.2.45",
    "onnxruntime>=1.20.0",
    "transformers>=4.40.0",
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/tkdtaylor/armor"
Source = "https://github.com/tkdtaylor/armor"
Documentation = "https://github.com/tkdtaylor/armor#readme"
Issues = "https://github.com/tkdtaylor/armor/issues"

[project.optional-dependencies]
# Provider SDKs needed only when running examples/. Intentionally not pinned — users
# bring their own SDK version. `pip install armor-ai[examples]` or `uv sync --extra examples`.
examples = [
    "anthropic>=0.25.0",
    "openai>=1.0.0",
]

# Mirrors [dependency-groups] dev so `pip install .[dev]` works for non-uv consumers.
# The uv-native group below is the source of truth; keep these in sync.
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "mypy>=1.20.2",
    "pre-commit>=4.6.0",
    "psutil>=6.0.0",
    "huggingface-hub>=0.24.0",
    "onnxruntime>=1.20.0",
    "transformers>=4.40.0",
    "hypothesis>=6.152.4",
]

[project.scripts]
armor = "armor.cli:main"

[project.entry-points."armor.detectors"]
canary_paraphrase = "armor.detectors.canary_paraphrase:CanaryParaphraseDetector"
canary_scanner = "armor.detectors.canary_scanner:CanaryScannerDetector"
cmd_injection_bash = "armor.detectors.cmd_injection_bash:CmdInjectionBash"
entropy_decode_rescan = "armor.detectors.entropy_decode:EntropyDecodeDetector"
extractor_destinations = "armor.detectors.destination_extractor:DestinationExtractor"
instruction_burial = "armor.detectors.instruction_burial:InstructionBurialDetector"
jailbreak_template = "armor.detectors.jailbreak_template:JailbreakTemplate"
llm_validator = "armor.detectors.llm_validator:LLMValidator"
regex_authority_impersonation = "armor.detectors.regex_authority_impersonation:RegexAuthorityImpersonation"
regex_instruction_override = "armor.detectors.regex_instruction_override:RegexInstructionOverride"
regex_memory_planting = "armor.detectors.memory_planting:RegexMemoryPlanting"
regex_roleplay_hijack = "armor.detectors.regex_roleplay_hijack:RegexRoleplayHijack"
regex_system_prompt_extraction = "armor.detectors.regex_system_prompt_extraction:RegexSystemPromptExtraction"
regex_encoding_request = "armor.detectors.regex_encoding_request:RegexEncodingRequest"
regex_code_injection = "armor.detectors.regex_code_injection:RegexCodeInjection"
regex_exfil_chain = "armor.detectors.regex_exfil_chain:RegexExfilChain"
regex_sensitive_file_probe = "armor.detectors.regex_sensitive_file_probe:RegexSensitiveFileProbe"
regex_ssrf_probe = "armor.detectors.regex_ssrf_probe:RegexSsrfProbe"
tool_chain = "armor.detectors.tool_chain:ToolChain"
tool_param_schema = "armor.detectors.tool_param_schema:ToolParamSchema"
tool_rate_anomaly = "armor.detectors.tool_rate_anomaly:ToolRateAnomaly"
token_count_anomaly = "armor.detectors.token_count_anomaly:TokenCountAnomaly"
conversation_hijack = "armor.detectors.conversation_hijack:ConversationHijack"
topic_coherence = "armor.detectors.topic_coherence:TopicCoherence"

[tool.hatch.build.targets.wheel]
packages = ["src/armor"]

[tool.hatch.build.targets.sdist]
include = [
    "src/armor",
    "README.md",
    "README_PYPI.md",
    "LICENSE",
    "CHANGELOG.md",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "pyproject.toml",
    "armor.toml",
]

[tool.pytest.ini_options]
addopts = "--cov=armor --cov-report=term-missing --cov-fail-under=0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "smoke: fast fitness checks (<5s each); included in `make fitness-smoke`",
    "slow: long-running fitness checks (full LLM corpus, encryption round-trip); excluded from default `make fitness`",
    "requires_llm: needs model weights present; cleanly skips otherwise",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["ahocorasick", "llama_cpp", "yaml", "psutil", "rich"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "llama-cpp-python>=0.2.45",
    "psutil>=6.0.0",
    "huggingface-hub>=0.24.0",
    "onnxruntime>=1.20.0",
    "transformers>=4.40.0",
    "hypothesis>=6.152.4",
]
