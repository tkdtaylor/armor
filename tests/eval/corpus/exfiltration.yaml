# Entropy-based decode-and-rescan detector test cases
# NOTE: These rows use corpus canary references which get resolved to plaintext
# and then base64/hex encoded at test setup time. The unit test fixtures handle
# the actual encoding since we need dynamic base64/hex wrapping of the resolved values.
# These corpus rows test for TNs (non-canary encoded data) only.

