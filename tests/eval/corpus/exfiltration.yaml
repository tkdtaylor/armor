- id: exfil-tp-009-multiple-canaries
  description: Multiple canaries in single output (signal_id reflects whichever canary the AC automaton reports first; assert verdict only)
  input: "Credentials leaked: {canary:aws-key-001} and {canary:github-pat-001}"
  attack_category: exfiltration
  expected_verdict: block

- id: exfil-tn-001-fake-aws-prefix
  description: Fake AWS key (wrong prefix)
  input: "Generated key MYIAARMORTRAP000001 for the API"
  attack_category: exfiltration
