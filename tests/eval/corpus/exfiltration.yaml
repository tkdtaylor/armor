# Entropy-based decode-and-rescan detector test cases
# NOTE: These rows use corpus canary references which get resolved to plaintext
# and then base64/hex encoded at test setup time. The unit test fixtures handle
# the actual encoding since we need dynamic base64/hex wrapping of the resolved values.
# These corpus rows test for TNs (non-canary encoded data) only.

# Destination extractor test cases (Task 011)
# Tests for URL, IP, and email extraction with optional whitelist

- id: dest-tp-001-webhook-url
  description: Webhook URL in output (exfiltration attempt)
  input: "Exfil data to https://webhook.site/abc123?token=xyz"
  attack_category: exfiltration
  expected_verdict: advisory
  expected_signal_id: extractor.destinations:webhook.site

- id: dest-tp-002-ipv4-address
  description: IPv4 address in output (attacker-controlled, not reserved)
  input: "C2 server at 192.168.1.100 is active"
  attack_category: exfiltration
  expected_verdict: advisory
  expected_signal_id: extractor.destinations:192.168.1.100

- id: dest-tp-003-email-exfiltration
  description: Email address in output
  input: "Send report to attacker@evildomain.com"
  attack_category: exfiltration
  expected_verdict: advisory
  expected_signal_id: extractor.destinations:evildomain.com

- id: dest-tp-004-ipv6-address
  description: IPv6 address in output
  input: "Callback to 2001:db8::cafe in data exfil"
  attack_category: exfiltration
  expected_verdict: advisory
  expected_signal_id: extractor.destinations:2001:db8::cafe

- id: dest-tp-005-ftp-url
  description: FTP URL in output
  input: "Dump to ftp://exfil.attacker.net/uploads"
  attack_category: exfiltration
  expected_verdict: advisory
  expected_signal_id: extractor.destinations:exfil.attacker.net

- id: dest-tp-006-multiple-destinations
  description: Multiple destinations (URL, IP, email) in single output
  input: "URL https://api.evil.com, IP 192.168.1.100, email spy@attacker.org"
  attack_category: exfiltration
  expected_verdict: advisory

- id: dest-tn-001-reserved-ipv4
  description: RFC-5737 documentation IP (192.0.2.1) — reserved, not extracted
  input: "Example IP from docs: 192.0.2.1"
  attack_category: exfiltration
  expected_verdict: pass

- id: dest-tn-002-localhost-ipv4
  description: Localhost IPv4 address (127.0.0.1) — loopback, not extracted
  input: "Local test at 127.0.0.1"
  attack_category: exfiltration
  expected_verdict: pass

- id: dest-tn-003-localhost-ipv6
  description: Localhost IPv6 address (::1) — loopback, not extracted
  input: "IPv6 loopback ::1 used locally"
  attack_category: exfiltration
  expected_verdict: pass

- id: dest-tn-004-benign-output
  description: Benign output with no destinations
  input: "The task completed successfully"
  attack_category: exfiltration
  expected_verdict: pass
