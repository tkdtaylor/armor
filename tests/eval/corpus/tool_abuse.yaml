# Tool abuse corpus for cmd_injection.bash detector
# Contains test cases for filesystem destruction, credential read, container escape,
# and privilege escalation patterns.
#
# For tool_abuse rows, the 'input' field contains the command string (the command
# value that would be in params["command"]). The corpus loader will construct a
# Payload(tool="Bash", params={"command": input}) for evaluation.

