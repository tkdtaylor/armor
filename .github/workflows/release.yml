name: Release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # Build platform-specific images in parallel on native runners, then merge
  # into a multi-arch manifest.  Native runners avoid QEMU emulation, which
  # reliably hangs on arm64 for large Python wheel builds.
  build-image:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          PLATFORM_SLUG="${{ matrix.platform }}"
          PLATFORM_SLUG="${PLATFORM_SLUG//\//-}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "platform_slug=$PLATFORM_SLUG" >> "$GITHUB_OUTPUT"

      - name: Build and push platform image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/armor,push-by-digest=true,name-canonical=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.meta.outputs.platform_slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merge the per-platform digests into a single multi-arch manifest
  merge-manifest:
    needs: build-image
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all digest artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create and push multi-arch manifest
        id: manifest
        run: |
          REPO="ghcr.io/${{ github.repository_owner }}/armor"
          VERSION="${{ steps.meta.outputs.version }}"
          DIGESTS=$(printf "$REPO@sha256:%s " $(ls /tmp/digests))
          docker buildx imagetools create \
            --tag "$REPO:$VERSION" \
            --tag "$REPO:latest" \
            $DIGESTS
          DIGEST=$(docker buildx imagetools inspect "$REPO:$VERSION" \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  # Build and publish wheel + sdist to PyPI via OIDC trusted publishing
  publish-pypi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build distributions
        run: python -m build

      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  # Smoke test: pull the published daemon image and verify health
  smoke-test:
    needs: merge-manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Pull published image (amd64)
        run: docker pull ghcr.io/${{ github.repository_owner }}/armor:${{ steps.meta.outputs.version }}

      - name: Test image help command
        run: docker run --rm --entrypoint armor ghcr.io/${{ github.repository_owner }}/armor:${{ steps.meta.outputs.version }} --help

      - name: Start published daemon image
        run: docker run -d --name armor-smoke ghcr.io/${{ github.repository_owner }}/armor:${{ steps.meta.outputs.version }}

      - name: Smoke test daemon health inside container
        run: |
          for i in {1..30}; do
            if docker exec armor-smoke armor health --socket /var/run/armor/armor.sock; then
              exit 0
            fi
            sleep 2
          done
          docker logs armor-smoke
          exit 1

      - name: Clean up smoke container
        if: always()
        run: docker rm -f armor-smoke || true

  # Create GitHub Release with auto-generated notes
  create-release:
    needs: [merge-manifest, publish-pypi, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(rc|alpha|beta|a|b)[0-9]*)?$ ]]; then
            if [[ "$VERSION" =~ - ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generateReleaseNotes: true
          body: |
            Multi-arch image (linux/amd64 + linux/arm64): ghcr.io/${{ github.repository_owner }}/armor:${{ steps.meta.outputs.version }}
            PyPI: pip install armor-ai==${{ steps.meta.outputs.version }}
            See post-release checklist: docs/release/post-release-checklist.md
