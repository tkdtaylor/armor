# docker-compose.yml — armor local image
#
# Usage:
#   docker compose -f docker/docker-compose.yml build dev
#   docker compose -f docker/docker-compose.yml run --rm dev armor --help
#   docker compose -f docker/docker-compose.yml run --rm dev

services:
  dev:
    image: armor-dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
    entrypoint: []
    command: /bin/sh
    volumes:
      # Host project root for development commands such as `make demo`.
      - type: bind
        source: ..
        target: /app
        read_only: false
    working_dir: /app
    stdin_open: true
    tty: true
